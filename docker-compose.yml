services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes:
      - ./models:/app/models:ro   # swap in a newly trained model without rebuilding
  mlflow:
    image: python:3.11-slim
    command: >
      sh -c "pip install --no-cache-dir mlflow && mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts"
    ports: ["5000:5000"]
    volumes:
      - mlflow-data:/mlflow
volumes:
  mlflow-data:
