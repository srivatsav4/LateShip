name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system libs (LightGBM needs OpenMP)
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (synthetic fixtures only; no Olist data, no external services)
        run: pytest
      - name: Demo pipeline smoke test
        run: python scripts/run_demo.py
